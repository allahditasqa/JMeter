name: JMeter Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  jmeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JMeter 5.6.3
        run: |
          curl -sSLo jmeter.zip https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q jmeter.zip
          chmod +x apache-jmeter-5.6.3/bin/jmeter apache-jmeter-5.6.3/bin/jmeter.sh
          echo "$PWD/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"
      - name: Run small load test
        run: |
          mkdir -p results
          jmeter -n -t test-plans/jsonplaceholder-load.jmx -Jthreads=3 -Jrampup=3 -Jduration=20 -l results/ci.jtl -j results/jmeter.log -e -o reports/ci > results/stdout.txt 2>&1 || {
            echo "::error::JMeter failed: $(tail -n 15 results/stdout.txt results/jmeter.log 2>/dev/null | tr '
' ' ' | cut -c1-1500)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: reports
