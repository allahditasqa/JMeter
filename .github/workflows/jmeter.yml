name: JMeter
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  jmeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traceability check (documents, master CSV, plans)
        run: node tools/docs.js check
      - name: Install JMeter 5.6.3
        run: |
          curl -sSLo jmeter.zip https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q jmeter.zip
          chmod +x apache-jmeter-5.6.3/bin/jmeter apache-jmeter-5.6.3/bin/jmeter.sh
      - name: Run both plans (short profile) and write the module-wise reports
        run: JMETER="$PWD/apache-jmeter-5.6.3/bin/jmeter" node tools/run-jmeter.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-reports
          path: reports
