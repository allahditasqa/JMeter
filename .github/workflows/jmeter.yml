name: JMeter Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  jmeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run JMeter (small load) via Docker
        run: |
          mkdir -p results
          docker run --rm -v "$PWD:/work" -w /work justb4/jmeter:5.5 \
            -n -t test-plans/jsonplaceholder-load.jmx \
            -Jthreads=3 -Jrampup=3 -Jduration=20 \
            -l results/ci.jtl -e -o reports/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: reports
